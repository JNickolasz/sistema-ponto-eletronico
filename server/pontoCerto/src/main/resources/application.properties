# Config banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true


api.security.admin-key=${ADMIN_KEY:admin123}
api.security.token.secret=${JWT_SECRET:35lpeCeRoUhrMvr0sDGw69T8Z0a+iCGOFR58VQhEEc4=}
api.security.token.expiration=86400000
api.security.issuer = ${API_ISSUER:pontoCerto-api}

api.pairing.code.expiration=${PAIRING_CODE_EXPIRATION:10}

# Upload e proxy reverso (Render / Railway / Nginx)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://*.localhost:5173}
app.schema-adjuster.enabled=${SCHEMA_ADJUSTER_ENABLED:true}

# Protecao contra picos de carga, conexoes lentas e brute-force
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:4096}
server.tomcat.connection-timeout=15s
server.error.include-stacktrace=never
server.error.include-message=never
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000
app.security.rate-limit.enabled=true
app.security.rate-limit.redis-enabled=${RATE_LIMIT_REDIS_ENABLED:false}
app.security.rate-limit.general-per-min=180
app.security.rate-limit.heavy-per-min=30
app.security.rate-limit.admin-per-min=40

# Redis opcional para rate limit distribuido em multiplas instancias (ou use SPRING_DATA_REDIS_URL)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

spring.application.name=pontoCerto
