# Config banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true


api.security.admin-key=${ADMIN_KEY:admin123}
api.security.token.secret=${JWT_SECRET:35lpeCeRoUhrMvr0sDGw69T8Z0a+iCGOFR58VQhEEc4=}
api.security.token.expiration=86400000
api.security.issuer = ${API_ISSUER:pontoCerto-api}

api.pairing.code.expiration=${PAIRING_CODE_EXPIRATION:10}

# Upload e proxy reverso (Render / Railway / Nginx)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.schema-adjuster.enabled=${SCHEMA_ADJUSTER_ENABLED:true}

# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

spring.application.name=pontoCerto
